<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO - Asistente Personal</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="text-center space-y-2 border-b border-slate-700 pb-6">
      <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400">NEXO</h1>
      <p class="text-slate-400">Tu centro de control personal para tareas, notas y recordatorios.</p>
    </header>

    <!-- Panel de Módulos -->
    <main class="grid md:grid-cols-3 gap-6">
      
     <!-- SECCIÓN TAREAS -->
<section class="bg-slate-800/80 p-4 rounded-xl border border-slate-700/50 shadow-lg space-y-3">
  <div class="flex justify-between items-center">
    <h2 class="text-sm font-semibold tracking-wide text-slate-300 uppercase flex items-center gap-2">
      📋 Tareas 
      <span id="task-counter" class="bg-indigo-600/30 text-indigo-400 text-xs px-2 py-0.5 rounded-full font-mono">0 pendientes</span>
    </h2>
  </div>

  <!-- Formulario de creación -->
  <form id="form-task" class="flex gap-2">
    <input type="text" id="input-task-title" placeholder="Añadir nueva tarea..." required
      class="w-full bg-slate-900/60 border border-slate-700/60 rounded px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded text-xs font-medium transition-colors">
      Agregar
    </button>
  </form>

  <!-- Pestañas de filtrado -->
  <div class="flex gap-1 border-b border-slate-700/50 pb-2 text-xs">
    <button id="filter-all" class="task-filter-btn px-2.5 py-1 rounded font-medium bg-slate-700 text-slate-200">
      Todas
    </button>
    <button id="filter-pending" class="task-filter-btn px-2.5 py-1 rounded font-medium text-slate-400 hover:text-slate-200">
      Pendientes
    </button>
    <button id="filter-completed" class="task-filter-btn px-2.5 py-1 rounded font-medium text-slate-400 hover:text-slate-200">
      Completadas
    </button>
  </div>

  <!-- Lista de Tareas -->
  <div id="tasks-list" class="space-y-2"></div>
</section>

      <!-- Columna: Notas -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold mb-4 text-amber-400">📝 Notas</h2>
          <form id="form-note" class="mb-4 space-y-2">
            <input type="text" id="input-note-title" placeholder="Título..." required class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-amber-500">
            <textarea id="input-note-content" placeholder="Contenido..." required class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-amber-500 h-16 resize-none"></textarea>
            <button type="submit" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-1.5 rounded text-sm transition">Agregar Nota</button>
          </form>
          <div id="notes-list" class="space-y-2 text-sm text-slate-300"></div>
        </div>
      </section>

      <!-- Columna: Recordatorios -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg flex flex-col justify-between">
        <div>
          <h2 class="text-xl font-bold mb-4 text-sky-400">🔔 Recordatorios</h2>
          <form id="form-reminder" class="mb-4 space-y-2">
            <input type="text" id="input-reminder-title" placeholder="Recordatorio..." required class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-sky-500">
            <input type="datetime-local" id="input-reminder-date" required class="w-full px-3 py-1.5 bg-slate-900 border border-slate-700 rounded text-sm focus:outline-none focus:border-sky-500 text-slate-400">
            <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-medium py-1.5 rounded text-sm transition">Agregar Recordatorio</button>
          </form>
          <div id="reminders-list" class="space-y-2 text-sm text-slate-300"></div>
        </div>
      </section>

    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
