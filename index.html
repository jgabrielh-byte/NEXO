<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXO - Asistente Personal</title>
  <!-- CDN de Tailwind CSS para estilos rápidos -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 font-sans">
  <div class="max-w-4xl mx-auto space-y-8">
    
    <!-- Encabezado -->
    <header class="text-center space-y-2 border-b border-slate-700 pb-6">
      <h1 class="text-4xl font-extrabold tracking-tight text-indigo-400">NEXO</h1>
      <p class="text-slate-400">Tu centro de control personal para tareas, notas y recordatorios.</p>
    </header>

    <!-- Panel de Módulos -->
    <main class="grid md:grid-cols-3 gap-6">
      
      <!-- Columna: Tareas -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-4 text-emerald-400">📋 Tareas</h2>
        <div id="tasks-list" class="space-y-2 text-sm text-slate-300">
          <p class="italic text-slate-500">Cargando tareas...</p>
        </div>
      </section>

      <!-- Columna: Notas -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-4 text-amber-400">📝 Notas</h2>
        <div id="notes-list" class="space-y-2 text-sm text-slate-300">
          <p class="italic text-slate-500">Cargando notas...</p>
        </div>
      </section>

      <!-- Columna: Recordatorios -->
      <section class="bg-slate-800 p-5 rounded-xl border border-slate-700 shadow-lg">
        <h2 class="text-xl font-bold mb-4 text-sky-400">🔔 Recordatorios</h2>
        <div id="reminders-list" class="space-y-2 text-sm text-slate-300">
          <p class="italic text-slate-500">Cargando recordatorios...</p>
        </div>
      </section>

    </main>
  </div>
  <script src="app.js"></script>
</body>
</body>
</html>
